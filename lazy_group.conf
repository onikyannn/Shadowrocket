[Rule]
# Типы правил:
# DOMAIN-SUFFIX сопоставляет суффикс домена запроса; пример ниже показывает совпадение с поддоменами.
# DOMAIN-KEYWORD сопоставляет ключевое слово в домене запроса.
# DOMAIN-WILDCARD сопоставляет домен запроса и поддерживает шаблоны * и ?.
# DOMAIN сопоставляет полное доменное имя запроса.
# DOMAIN-SUFFIX сопоставляет суффикс домена запроса; пример ниже показывает совпадение с поддоменами.
# USER-AGENT сопоставляет строку User-Agent и поддерживает шаблон *.
# URL-REGEX сопоставляет URL по регулярному выражению.
# IP-CIDR сопоставляет IPv4 или IPv6. Для доменных запросов выполняется локальное DNS-разрешение, если не указан no-resolve.
# IP-ASN сопоставляет номер ASN, которому принадлежит IP-адрес.
# RULE-SET сопоставляет содержимое набора правил, включающего типы правил.
# DOMAIN-SET сопоставляет содержимое набора доменов без указания типов правил.
# SCRIPT сопоставляет имя скрипта; сначала создайте скрипт типа rule, затем добавьте правило типа script.
# DST-PORT сопоставляет порт целевого хоста.
# GEOIP сопоставляет IP-адрес по базе геолокации.
# FINAL — резервная политика, используемая, когда остальные правила не совпали.
# DST-PORT сопоставляет порт целевого хоста.
# DST-PORT сопоставляет порт целевого хоста.
# DST-PORT сопоставляет порт целевого хоста.

# Политики правил:
# PROXY: пересылает трафик через прокси-сервер.
# DIRECT: подключение без прокси-сервера.
# TAILSCALE: пересылка через выход Tailscale.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# REJECT: отклоняет соединение с указанным типом ответа.
# Кроме этого, политикой правила могут быть группа прокси, имя подписки, группа или узел.

# Приоритет сопоставления правил:
# 1. Правила модуля имеют приоритет над правилами конфигурации.
# 2. Правила сопоставляются сверху вниз.
# 3. Доменные правила имеют приоритет над правилами IP.

# Блокировка UDP/443 принудительно откатывает HTTP/3/QUIC к HTTP/2 или HTTP/1.1; для включения раскомментируйте правило AND.
# AND,((PROTOCOL,UDP),(DST-PORT,443)),REJECT-NO-DROP

