[Rule]
# Типы правил:
# DOMAIN-SUFFIX: сопоставляет суффикс домена запроса. Например, DOMAIN-SUFFIX,example.com,DIRECT соответствует a.example.com и a.b.example.com.
# DOMAIN-KEYWORD: сопоставляет ключевое слово в домене запроса. Например, DOMAIN-KEYWORD,exa,DIRECT соответствует a.example.com и a.b.example.com.
# DOMAIN-WILDCARD: сопоставляет домен запроса, поддерживает wildcard * и ?. Например, DOMAIN-WILDCARD,a*c.example*.com,DIRECT соответствует abc.example123.com и aqwec.example456.com.
# DOMAIN: сопоставляет полное доменное имя запроса. Например, DOMAIN,www.example.com,DIRECT соответствует только www.example.com.
# Если для DOMAIN, DOMAIN-SUFFIX, DOMAIN-WILDCARD и DOMAIN-KEYWORD заданы одинаковые значения, действует только один из этих типов.
# USER-AGENT: сопоставляет строку User-Agent, поддерживает wildcard *. Например, USER-AGENT,MicroMessenger*,DIRECT соответствует MicroMessenger Client.
# URL-REGEX: сопоставляет URL по регулярному выражению. Например, URL-REGEX,^https?://.+/item.+,REJECT соответствует https://www.example.com/item/abc/123.
# IP-CIDR: сопоставляет адрес IPv4 или IPv6. Например, IP-CIDR,192.168.1.0/24,DIRECT соответствует диапазону 192.168.1.1–192.168.1.254. Когда запрос доменного имени встречает IP-правило, Shadowrocket запрашивает локальный DNS-сервер, чтобы проверить соответствие IP хоста правилу. С no-resolve (например, IP-CIDR,172.16.0.0/12,DIRECT,no-resolve) доменный запрос пропускает правило без локального DNS-запроса.
# IP-ASN: сопоставляет ASN, которому принадлежит IP-адрес. Например, IP-ASN,56040,DIRECT соответствует IP-адресам сети China Mobile Communications Corporation.
# RULE-SET: сопоставляет содержимое набора правил. Набор должен содержать типы правил, например https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list. Также поддерживаются наборы, содержащие только IP-адреса без указания типов правил.
# DOMAIN-SET: сопоставляет содержимое набора доменов без указания типов правил, например https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list.
# SCRIPT сопоставляет имя скрипта; сначала создайте скрипт типа rule, затем добавьте правило типа script.
# DST-PORT: сопоставляет порт целевого хоста. Например, DST-PORT,443,DIRECT соответствует целевому порту 443.
# GEOIP: сопоставляет IP по базе геолокации. Например, GEOIP,CN,DIRECT соответствует IP-адресам региона CN.
# FINAL: завершающая политика. Например, FINAL,PROXY применяется, только если ни одно другое правило не совпало.
# AND: логическое правило «И». Например, AND,((DOMAIN,www.example.com),(DST-PORT,123)),DIRECT соответствует www.example.com:123.
# NOT: логическое правило «НЕ». Например, NOT,((DST-PORT,123)),DIRECT соответствует всем запросам, кроме запросов к порту 123.
# OR: логическое правило «ИЛИ». Например, OR,((DST-PORT,123),(DST-PORT,456)),DIRECT соответствует всем запросам к порту 123 или 456.

# Политики правил:
# PROXY: пересылает трафик через прокси-сервер.
# DIRECT: подключение без прокси-сервера.
# TAILSCALE: выход Tailscale. Пересылает трафик через туннель Tailscale.
# REJECT: отклоняет запрос. Возвращает HTTP 404 без содержимого.
# REJECT-DICT: отклоняет запрос. Возвращает HTTP 200 с пустым объектом JSON.
# REJECT-ARRAY: отклоняет запрос. Возвращает HTTP 200 с пустым массивом JSON.
# REJECT-200: отклоняет запрос. Возвращает HTTP 200 без содержимого.
# REJECT-IMG: отклоняет запрос. Возвращает HTTP 200 с GIF размером 1 пиксель.
# REJECT-TINYGIF: отклоняет запрос. Возвращает HTTP 200 с GIF размером 1 пиксель.
# REJECT-VIDEO: отклоняет запрос. Возвращает HTTP 200 с пустым MP4.
# REJECT-DROP: отклоняет запрос. Отбрасывает IP-пакеты.
# REJECT-NO-DROP: отклоняет запрос. Возвращает ICMP «порт недоступен».
# Кроме этого, политикой правила могут быть группа прокси, имя подписки, группа или узел.

# Приоритет сопоставления правил:
# 1. Правила модуля имеют приоритет над правилами конфигурации.
# 2. Правила сопоставляются сверху вниз.
# 3. Доменные правила имеют приоритет над правилами IP.

# Блокировка UDP-трафика на порту 443: HTTP3/QUIC получает всё большее распространение, но в китайских ISP и на международных выходных каналах UDP имеет низкий приоритет и работает плохо. Блокировка принудительно переключает соединения на HTTP2/HTTP1.1. Чтобы включить это логическое правило, удалите символ комментария # перед AND. Другой способ — параметр block-quic=all-proxy|all|always-allow в разделе General.
# AND,((PROTOCOL,UDP),(DST-PORT,443)),REJECT-NO-DROP

