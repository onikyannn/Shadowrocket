# GEOIP сопоставляет IP-адрес по базе геолокации.
GEOIP,CN,DIRECT

# Политика FINAL применяется, только если никакое другое правило не совпало.
FINAL,PROXY


[Host]
# Назначение домену локального значения:
# example.com = 1.2.3.4

# Назначение домену DNS-сервера:
# example.com = server:1.2.3.4

# Назначение DNS-сервера по имени Wi-Fi; несколько DNS разделяются запятыми:
# Назначение DNS-сервера по имени Wi-Fi; несколько DNS разделяются запятыми:

*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1

[URL Rewrite]
# Перезапись для предотвращения перенаправлений поисковика Google.
^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
# Shadowrocket расшифровывает запросы только для доменов hostname; поддерживаются шаблоны и исключения с префиксом -. Расшифровка некоторых доменов Apple и iCloud может вызвать проблемы.
# Shadowrocket расшифровывает запросы только для доменов hostname; поддерживаются шаблоны и исключения с префиксом -. Расшифровка некоторых доменов Apple и iCloud может вызвать проблемы.

hostname = *.google.cn
