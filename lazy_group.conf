^https?://(www.)?g.cn https://www.google.com 302
^https?://(www.)?google.cn https://www.google.com 302

[MITM]
# Shadowrocket расшифровывает запросы только к доменам, указанным в hostname; поддерживаются wildcard. Префикс - исключает отдельные имена хостов, например -*.example.com. iOS и некоторые приложения применяют строгие политики безопасности и доверяют только определённым сертификатам; включение расшифровки для таких доменов, например *.apple.com и *.icloud.com, может вызвать проблемы.
# Начиная с версии 2.2.81 (3096) поддерживается расшифровка HTTPS-трафика посредством MITM через HTTP/2. Команда h2 = true в разделе [MITM] текстовой конфигурации включает эту функцию и равнозначна соответствующему переключателю в UI.

hostname = *.google.cn
