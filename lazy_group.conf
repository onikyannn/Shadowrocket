[Proxy Group]
# Типы групп прокси:
# select: ручной выбор узла.
# url-test: автоматический выбор узла с наименьшей задержкой.
# fallback: автоматическое переключение на другой доступный узел при сбое.
# load-balance: запросы разных правил подключаются через разные узлы группы.
# random: случайно выбирает разные узлы группы.

# policy-regex-filter задаёт фильтрацию по регулярному выражению или ключевым словам.
# 1. Оставить узлы, имена которых содержат ключевые слова A и B:
# (?=.*(A))^(?=.*(B))^.*$
# 2. Оставить узлы, имена которых содержат A или B:
# A|B
# 3. Исключить узлы, имена которых содержат A или B:
# ^((?!(A|B)).)*$
# 4. Оставить узлы с A и исключить узлы с B:
# (?=.*(A))^((?!(B)).)*$

# Дополнительные параметры групп прокси:
# interval: интервал повторной проверки.
# timeout: прекратить проверку по истечении времени ожидания.
# tolerance: сменить маршрут, лишь когда оценка нового победителя выше старой с учётом допуска.
# url: URL для проверки.

# Пример группы прокси без фильтра регулярного выражения:
# Имя = тип, политики или подписки, параметры проверки и URL. Полный формат показан в строке ниже.

# Пример группы прокси с фильтром регулярного выражения:
# policy-regex-filter задаёт фильтрацию по регулярному выражению или ключевым словам.

# Пример группы прокси с фильтрацией подписки:
# policy-regex-filter задаёт фильтрацию по регулярному выражению или ключевым словам.

