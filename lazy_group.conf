# Назначение DNS-сервера по имени Wi-Fi; несколько DNS разделяются запятыми:
# ssid:имя_Wi-Fi = server:1.2.3.4

*.apple.com = server:system
*.icloud.com = server:system
localhost = 127.0.0.1

[URL Rewrite]
